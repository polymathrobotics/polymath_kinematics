# Virtual uv workspace root: no [project] table, so this directory is not itself a package.
# It exists to give both Python members one shared lockfile and one shared .venv.
[tool.uv.workspace]
members = [
    "polymath_kinematics",
    "polymath_kinematics_python_tools",
]

[tool.uv.sources]
polymath_kinematics = { workspace = true }
